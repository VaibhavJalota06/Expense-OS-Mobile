name: Redirect GitHub Pages to Vercel

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy_web.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  redirect-pages:
    name: Deploy Vercel Redirect to GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - name: Create Redirect Site
        run: |
          mkdir -p _site
          cat << 'EOF' > _site/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta http-equiv="refresh" content="0; url=https://expense-os-mobile.vercel.app/landing">
            <link rel="canonical" href="https://expense-os-mobile.vercel.app/landing">
            <title>Redirecting to Expense OS...</title>
            <script>
              (function() {
                var target = 'https://expense-os-mobile.vercel.app';
                var path = window.location.pathname.replace(/^\/Expense-OS-Mobile/, '');
                var search = window.location.search || '';
                var hash = window.location.hash || '';
                if (!path || path === '/' || path === '/index.html') {
                  window.location.replace(target + '/landing' + search + hash);
                } else {
                  window.location.replace(target + path + search + hash);
                }
              })();
            </script>
          </head>
          <body style="background:#090C11;color:#f8fafc;font-family:system-ui,-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;text-align:center;">
            <div>
              <h2 style="color:#38bdf8;margin-bottom:0.5rem;">Redirecting to Expense OS...</h2>
              <p style="color:#94a3b8;">Please wait or <a href="https://expense-os-mobile.vercel.app/landing" style="color:#38bdf8;text-decoration:underline;">click here if not redirected automatically</a>.</p>
            </div>
          </body>
          </html>
          EOF

          # Mirror to 404.html to catch all subroutes
          cp _site/index.html _site/404.html
          touch _site/.nojekyll

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true

