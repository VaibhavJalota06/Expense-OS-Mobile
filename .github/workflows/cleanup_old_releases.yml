name: Cleanup Old GitHub Releases & Tags

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cleanup_old_releases.yml'

permissions:
  contents: write

jobs:
  cleanup:
    name: Delete Old Releases & Tags
    runs-on: ubuntu-latest
    steps:
      - name: Delete Old Releases and Tags
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const keepTag = 'v3.3.5';

            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner,
              repo,
              per_page: 100
            });

            console.log(`Found ${releases.length} releases in total.`);
            for (const release of releases) {
              if (release.tag_name !== keepTag) {
                console.log(`Deleting release: ${release.name} (${release.tag_name}, ID: ${release.id})`);
                await github.rest.repos.deleteRelease({
                  owner,
                  repo,
                  release_id: release.id
                });
              } else {
                console.log(`Keeping latest release: ${release.name} (${release.tag_name})`);
              }
            }

            const tags = await github.paginate(github.rest.repos.listTags, {
              owner,
              repo,
              per_page: 100
            });

            console.log(`Found ${tags.length} tags in total.`);
            for (const tag of tags) {
              if (tag.name !== keepTag) {
                console.log(`Deleting git tag: ${tag.name}`);
                try {
                  await github.rest.git.deleteRef({
                    owner,
                    repo,
                    ref: `tags/${tag.name}`
                  });
                } catch (e) {
                  console.log(`Notice for tag ${tag.name}: ${e.message}`);
                }
              }
            }
            console.log('✅ Cleanup complete! Only v3.3.5 is retained.');
