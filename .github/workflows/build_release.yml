name: Build & Release Multiplatform Apps (Android APK/AAB, iOS IPA, Tauri Desktop EXE)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  get-version:
    name: Extract Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
      tag: ${{ steps.extract.outputs.tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Version from pubspec.yaml
        id: extract
        run: |
          RAW_VER=$(grep '^version: ' pubspec.yaml | sed 's/version: //' | tr -d ' \r\n')
          CLEAN_VER=$(echo $RAW_VER | sed 's/+.*//')
          echo "version=$CLEAN_VER" >> $GITHUB_OUTPUT
          echo "tag=v$CLEAN_VER" >> $GITHUB_OUTPUT
          echo "Extracted App Version: $CLEAN_VER (Tag: v$CLEAN_VER)"

  run-tests:
    name: Run Unit Tests Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Run Test Suite
        run: flutter test test/unit_test.dart

  build-android:
    name: Build Android APK & AppBundle
    needs: [get-version, run-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Release APK & Bundle
        run: |
          flutter pub get
          flutter build apk --release
          flutter build appbundle --release
          mkdir -p output-apk
          cp build/app/outputs/flutter-apk/app-release.apk output-apk/ExpenseOS-Android.apk
          cp build/app/outputs/flutter-apk/app-release.apk output-apk/ExpenseOS-Android-v${{ needs.get-version.outputs.version }}.apk
          cp build/app/outputs/bundle/release/app-release.aab output-apk/ExpenseOS-Android-v${{ needs.get-version.outputs.version }}.aab

      - name: Upload Android APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ExpenseOS-Android-Binaries
          path: output-apk/*
          if-no-files-found: error

  build-ios:
    name: Build iOS IPA
    needs: [get-version, run-tests]
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          else
            echo "Using default system Xcode: $(xcode-select -p)"
          fi

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build iOS App (Unsigned IPA)
        run: |
          flutter pub get
          flutter precache --ios
          cd ios
          pod install --repo-update || pod install
          cd ..
          flutter build ios --release --no-codesign
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -9 -r ExpenseOS-iOS.ipa Payload
          cp ExpenseOS-iOS.ipa ExpenseOS-iOS-v${{ needs.get-version.outputs.version }}.ipa

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExpenseOS-iOS-IPA
          path: |
            ExpenseOS-iOS.ipa
            ExpenseOS-iOS-v${{ needs.get-version.outputs.version }}.ipa
          if-no-files-found: error

  build-desktop-exe:
    name: Build Windows Desktop Setup EXE
    needs: [get-version, run-tests]
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'web-desktop/package.json'

      - name: Install Dependencies
        working-directory: web-desktop
        run: npm ci

      - name: Build Windows Desktop Installer
        working-directory: web-desktop
        run: |
          npm run dist
          mkdir -p dist-release
          Get-ChildItem -Path "dist" -Filter "*.exe" | ForEach-Object {
            Copy-Item $_.FullName "dist-release/ExpenseOS-Windows-Setup.exe" -Force
            Copy-Item $_.FullName "dist-release/ExpenseOS-Windows-v${{ needs.get-version.outputs.version }}-Setup.exe" -Force
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ExpenseOS-Windows-EXE
          path: web-desktop/dist-release/*
          if-no-files-found: warn

  create-release:
    name: Publish Multiplatform GitHub Release
    needs: [get-version, build-android, build-ios, build-desktop-exe]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ExpenseOS-Android-Binaries
          path: release-assets

      - name: Download iOS Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ExpenseOS-iOS-IPA
          path: release-assets

      - name: Download Desktop Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ExpenseOS-Windows-EXE
          path: release-assets

      - name: Publish or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.get-version.outputs.tag || 'v3.3.5' }}
          name: Expense OS Multiplatform Release ${{ needs.get-version.outputs.tag || 'v3.3.5' }}
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
