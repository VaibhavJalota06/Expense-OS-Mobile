name: Build & Release Mobile App (APK & IPA)

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ExpenseOS-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build iOS App (Unsigned IPA)
        run: |
          cd ios && pod install && cd ..
          flutter build ios --simulator --no-codesign
          mkdir -p Payload
          cp -r build/ios/iphonesimulator/Runner.app Payload/
          zip -9 -r ExpenseOS-iOS.ipa Payload

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: ExpenseOS-iOS-IPA
          path: ExpenseOS-iOS.ipa

  create-release:
    name: Publish Release Assets
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: ExpenseOS-Android-APK
          path: artifacts/android

      - name: Download iOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: ExpenseOS-iOS-IPA
          path: artifacts/ios

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Expense OS Mobile Release
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/android/app-release.apk
            artifacts/ios/ExpenseOS-iOS.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

