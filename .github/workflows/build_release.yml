name: Build & Release Mobile App (APK & IPA)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure Android SDK & Gradle
        run: |
          chmod +x android/gradlew
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          flutter precache --android
          flutter pub get

      - name: Build Release APK
        run: |
          flutter build apk --release --no-tree-shake-icons -v > build_apk.log 2>&1 || (tail -n 100 build_apk.log && exit 1)

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ExpenseOS-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Precache & Dependencies
        run: |
          flutter precache --ios
          flutter pub get

      - name: Install CocoaPods Dependencies
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Build iOS App (Unsigned IPA)
        run: |
          flutter build ipa --no-codesign --no-tree-shake-icons -v > build_ios.log 2>&1 || (tail -n 100 build_ios.log && exit 1)
          mkdir -p Payload
          if [ -d "build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app" ]; then
            cp -r build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app Payload/
          elif [ -d "build/ios/iphoneos/Runner.app" ]; then
            cp -r build/ios/iphoneos/Runner.app Payload/
          fi
          zip -9 -r ExpenseOS-iOS.ipa Payload

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: ExpenseOS-iOS-IPA
          path: ExpenseOS-iOS.ipa

  build-desktop-exe:
    name: Build Windows Desktop EXE
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'web-desktop/package-lock.json'

      - name: Install Dependencies
        working-directory: web-desktop
        run: npm ci || npm install

      - name: Build Windows Executable
        working-directory: web-desktop
        run: |
          npx electron-builder --win --publish never
          Get-ChildItem -Path "dist" -Filter "*.exe" | ForEach-Object { Copy-Item $_.FullName ($_.FullName -replace ' ', '-') -ErrorAction SilentlyContinue }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Desktop Installer
        uses: actions/upload-artifact@v4
        with:
          name: ExpenseOS-Windows-EXE
          path: |
            web-desktop/dist/*.exe
            web-desktop/dist/latest.yml

  create-release:
    name: Publish Release Assets
    needs: [build-android, build-ios, build-desktop-exe]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: ExpenseOS-Android-APK
          path: artifacts/android

      - name: Download iOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: ExpenseOS-iOS-IPA
          path: artifacts/ios

      - name: Download Desktop Artifact
        uses: actions/download-artifact@v4
        with:
          name: ExpenseOS-Windows-EXE
          path: artifacts/desktop

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Expense OS Multiplatform Release
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/android/*.apk
            artifacts/ios/*.ipa
            artifacts/desktop/*.exe
            artifacts/desktop/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


