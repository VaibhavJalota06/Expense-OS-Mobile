name: Build iOS IPA & Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install CocoaPods & Dependencies
        run: |
          flutter pub get
          cd ios
          pod install
          cd ..

      - name: Build Optimized Small iOS Application Bundle
        run: flutter build ios --simulator --no-codesign --tree-shake-icons

      - name: Create Compact IPA Payload
        run: |
          mkdir -p Payload
          cp -r build/ios/iphonesimulator/Runner.app Payload/
          zip -9 -r Expense_OS_Mobile.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Expense_OS_Mobile.ipa
          path: Expense_OS_Mobile.ipa

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Expense_OS_Mobile_Android_APK
          path: build/app/outputs/flutter-apk/app-debug.apk
