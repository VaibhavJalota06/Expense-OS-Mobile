<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Stage Upgrade - Expense OS</title></head>
<body style="margin:0; padding:24px; background:#000000; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color:#FFFFFF;">
  <div style="max-width:580px; margin:0 auto; background:#121214; border-radius:16px; border:1px solid rgba(139,92,246,0.3); overflow:hidden; box-shadow:0 20px 40px rgba(0,0,0,0.8);">
    <div style="background:linear-gradient(135deg, #18181B, #4C1D95); padding:2rem; text-align:center; border-bottom:1px solid rgba(139,92,246,0.2);">
      <div style="font-size:3.5rem;">👑</div>
      <h1 style="color:#A78BFA; margin:0.5rem 0 0 0; font-size:1.6rem; font-weight:800;">Stage Upgraded!</h1>
      <p style="color:#DDD6FE; margin:0.25rem 0 0 0; font-size:0.9rem;">You Leveled Up in Expense OS</p>
    </div>
    <div style="padding:2rem;">
      <p style="color:#A1A1AA; line-height:1.6; font-size:0.95rem;">Congratulations {{to_name}}! Your financial discipline has unlocked the next tier:</p>
      <div style="background:#18181B; border:1px solid rgba(139,92,246,0.3); border-radius:12px; padding:1.25rem; text-align:center; margin:1.5rem 0;">
        <div style="font-size:0.85rem; color:#A1A1AA;">New Tier Level</div>
        <div style="font-size:1.8rem; font-weight:800; color:#A78BFA; margin:0.25rem 0;">{{new_stage_name}}</div>
        <div style="font-size:0.85rem; color:#DDD6FE;">+{{bonus_emeralds}} Bonus Emeralds Awarded 💎</div>
      </div>
      <div style="text-align:center; margin-top:1.5rem;">
        <a href="{{app_url}}" style="display:inline-block; background:#8B5CF6; color:#FFFFFF; font-weight:800; padding:0.85rem 1.75rem; border-radius:10px; text-decoration:none; font-size:0.95rem;">View Leaderboard & Rewards →</a>
      </div>
    </div>
    <div style="background:#09090B; padding:1rem; text-align:center; font-size:0.75rem; color:#71717A; border-top:1px solid rgba(255,255,255,0.06);">
      Sent automatically by Expense OS Gamification Engine
    </div>
  </div>
</body>
</html>
