<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Weekly Financial Digest - Expense OS</title></head>
<body style="margin:0; padding:24px; background:#000000; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color:#FFFFFF;">
  <div style="max-width:580px; margin:0 auto; background:#121214; border-radius:16px; border:1px solid rgba(255,255,255,0.08); overflow:hidden; box-shadow:0 20px 40px rgba(0,0,0,0.8);">
    <div style="background:linear-gradient(135deg, #18181B, #09090B); padding:2rem; text-align:center; border-bottom:1px solid rgba(255,255,255,0.08);">
      <h1 style="color:#10B981; margin:0; font-size:1.6rem; font-weight:800;">📊 Weekly Financial Digest</h1>
      <p style="color:#A1A1AA; margin:0.4rem 0 0 0; font-size:0.9rem;">Your 7-day spending & budget recap</p>
    </div>
    <div style="padding:2rem;">
      <p style="color:#A1A1AA; line-height:1.6; font-size:0.95rem;">Hello {{to_name}}, here is how your money moved this past week:</p>
      <div style="display:table; width:100%; margin:1.5rem 0; background:#18181B; border-radius:12px; border:1px solid rgba(255,255,255,0.06); padding:1rem;">
        <div style="display:table-row;">
          <div style="display:table-cell; padding:0.75rem; text-align:center; border-right:1px solid rgba(255,255,255,0.06);">
            <div style="font-size:0.8rem; color:#A1A1AA;">Total Spent</div>
            <div style="font-size:1.4rem; font-weight:800; color:#FB7185; margin-top:0.25rem;">{{total_spent}}</div>
          </div>
          <div style="display:table-cell; padding:0.75rem; text-align:center; border-right:1px solid rgba(255,255,255,0.06);">
            <div style="font-size:0.8rem; color:#A1A1AA;">Leftover Budget</div>
            <div style="font-size:1.4rem; font-weight:800; color:#10B981; margin-top:0.25rem;">{{leftover_budget}}</div>
          </div>
          <div style="display:table-cell; padding:0.75rem; text-align:center;">
            <div style="font-size:0.8rem; color:#A1A1AA;">Health Score</div>
            <div style="font-size:1.4rem; font-weight:800; color:#38BDF8; margin-top:0.25rem;">{{health_score}} / 100</div>
          </div>
        </div>
      </div>
      <div style="text-align:center; margin-top:1.5rem;">
        <a href="{{app_url}}" style="display:inline-block; background:#10B981; color:#000000; font-weight:800; padding:0.85rem 1.75rem; border-radius:10px; text-decoration:none; font-size:0.95rem;">Open Analytics Hub →</a>
      </div>
    </div>
    <div style="background:#09090B; padding:1rem; text-align:center; font-size:0.75rem; color:#71717A; border-top:1px solid rgba(255,255,255,0.06);">
      Sent automatically by Expense OS Cloud Engine
    </div>
  </div>
</body>
</html>
