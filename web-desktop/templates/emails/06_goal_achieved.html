<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Goal Achieved - Expense OS</title></head>
<body style="margin:0; padding:24px; background:#000000; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color:#FFFFFF;">
  <div style="max-width:580px; margin:0 auto; background:#121214; border-radius:16px; border:1px solid rgba(16,185,129,0.3); overflow:hidden; box-shadow:0 20px 40px rgba(0,0,0,0.8);">
    <div style="background:linear-gradient(135deg, #18181B, #064E3B); padding:2rem; text-align:center; border-bottom:1px solid rgba(16,185,129,0.2);">
      <div style="font-size:3.5rem;">🎯</div>
      <h1 style="color:#10B981; margin:0.5rem 0 0 0; font-size:1.6rem; font-weight:800;">Savings Goal Achieved!</h1>
      <p style="color:#A7F3D0; margin:0.25rem 0 0 0; font-size:0.9rem;">Milestone Unlocked</p>
    </div>
    <div style="padding:2rem;">
      <p style="color:#A1A1AA; line-height:1.6; font-size:0.95rem;">Incredible discipline, {{to_name}}! You reached 100% of your target for <strong style="color:#FFFFFF;">{{goal_title}}</strong>!</p>
      <div style="background:#18181B; border:1px solid rgba(16,185,129,0.3); border-radius:12px; padding:1.25rem; text-align:center; margin:1.5rem 0;">
        <div style="font-size:0.85rem; color:#A1A1AA;">Total Saved</div>
        <div style="font-size:2.2rem; font-weight:800; color:#10B981; margin:0.25rem 0;">{{target_amount}}</div>
        <div style="font-size:0.85rem; color:#A7F3D0;">100% Completed</div>
      </div>
      <div style="text-align:center; margin-top:1.5rem;">
        <a href="{{app_url}}" style="display:inline-block; background:#10B981; color:#000000; font-weight:800; padding:0.85rem 1.75rem; border-radius:10px; text-decoration:none; font-size:0.95rem;">Set Next Savings Goal →</a>
      </div>
    </div>
    <div style="background:#09090B; padding:1rem; text-align:center; font-size:0.75rem; color:#71717A; border-top:1px solid rgba(255,255,255,0.06);">
      Sent automatically by Expense OS Savings Goals Engine
    </div>
  </div>
</body>
</html>
