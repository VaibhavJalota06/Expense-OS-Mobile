[package]
name = "expense-os"
version = "3.3.5"
description = "Expense OS Personal Finance Command Center"
authors = ["Expense OS Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [ "shell-open", "notification-all", "dialog-all", "fs-all", "http-all" ] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
