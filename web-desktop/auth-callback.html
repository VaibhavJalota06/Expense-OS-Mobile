<!DOCTYPE html>
<html>
<head>
<title>Signing in to Expense OS...</title>
<style>
  body { font-family: system-ui, sans-serif; background: #050811; color: #fff; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center; }
  .card { background: #0f172a; padding: 2.5rem; border-radius: 1rem; border: 1px solid rgba(255,255,255,0.1); max-width: 400px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); }
  .spinner { width: 40px; height: 40px; border: 3px solid rgba(16,185,129,0.2); border-top-color: #10b981; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1rem; }
  @keyframes spin { to { transform: rotate(360deg); } }
  h2 { color: #10b981; margin: 0 0 0.5rem 0; }
  p { color: #94a3b8; font-size: 0.95rem; }
</style>
</head>
<body>
<div class="card">
  <div class="spinner"></div>
  <h2>Signing you in...</h2>
  <p>Transferring your session to Expense OS Desktop.</p>
</div>
<script>
// This page receives OAuth tokens in the URL hash fragment (#access_token=...)
// Hash fragments are NEVER sent to HTTP servers, so this page converts them
// to query parameters and redirects, allowing the server to intercept them.
(function() {
  var hash = window.location.hash;
  var search = window.location.search;
  var params = '';

  if (hash && hash.includes('access_token')) {
    // Convert hash params to query params
    params = '?' + hash.substring(1);
  } else if (search && search.includes('code=')) {
    params = search;
  }

  if (params) {
    // Redirect to the server with tokens as query params (server CAN read these)
    window.location.replace(window.location.origin + '/auth-complete' + params);
  } else {
    // No tokens found, redirect to main page
    window.location.replace(window.location.origin + '/');
  }
})();
</script>
</body>
</html>
