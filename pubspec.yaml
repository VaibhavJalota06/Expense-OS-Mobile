name: expense_os_mobile
description: "Expense OS - Futuristic Dark Glassmorphic Mobile Personal Finance Command Center"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Core Backend & Auth
  supabase_flutter: ^2.5.0
  shared_preferences: ^2.2.2
  
  # UI & Styling
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0
  intl: ^0.19.0
  
  # Charts & Data Visualization
  fl_chart: ^0.68.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
