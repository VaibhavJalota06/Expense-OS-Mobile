name: expense_os
description: "A comprehensive Expense OS mobile application."
publish_to: "none"
version: 3.2.3+73

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Core Backend & Auth
  supabase_flutter: ^2.5.0
  google_sign_in: ^6.2.1
  shared_preferences: ^2.2.2
  
  # UI & Styling
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0
  intl: ^0.19.0
  
  # Media & Camera
  image_picker: ^1.1.2

  # Charts & Data Visualization
  fl_chart: ^0.68.0
  flutter_local_notifications: ^22.3.0
  url_launcher: ^6.3.0
  google_mlkit_text_recognition: ^0.17.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
    - assets/logo.png
