<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Subscription Due Alert</title></head>
<body style="margin:0; padding:20px; background:#050811; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color:#e2e8f0;">
  <div style="max-width:580px; margin:0 auto; background:#0f172a; border-radius:16px; border:1px solid rgba(168,85,247,0.3); overflow:hidden; box-shadow:0 20px 25px rgba(0,0,0,0.5);">
    <div style="background:linear-gradient(135deg, #0f172a, #581c87); padding:1.75rem; text-align:center;">
      <div style="font-size:3rem;">🎬</div>
      <h1 style="color:#c084fc; margin:0.3rem 0 0 0; font-size:1.5rem;">Upcoming Subscription Renewal</h1>
    </div>
    <div style="padding:2rem;">
      <p style="color:#94a3b8; line-height:1.6;">Hello {{to_name}}, your recurring subscription for <strong>Netflix Premium</strong> is scheduled for auto-debit soon.</p>
      <div style="background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.08); border-radius:12px; padding:1.25rem; margin:1.5rem 0;">
        <div style="display:flex; justify-content:space-between; font-size:0.9rem; margin-bottom:0.5rem;">
          <span style="color:#64748b;">Service</span>
          <span style="color:#fff; font-weight:700;">Netflix Premium</span>
        </div>
        <div style="display:flex; justify-content:space-between; font-size:0.9rem; margin-bottom:0.5rem;">
          <span style="color:#64748b;">Amount</span>
          <span style="color:#34d399; font-weight:700;">₹649.00 / month</span>
        </div>
        <div style="display:flex; justify-content:space-between; font-size:0.9rem;">
          <span style="color:#64748b;">Auto-Debit Date</span>
          <span style="color:#c084fc; font-weight:700;">In 2 Days</span>
        </div>
      </div>
      <div style="text-align:center; margin-top:1.5rem;">
        <a href="http://localhost:58420" style="display:inline-block; background:#c084fc; color:#000; font-weight:800; padding:0.85rem 1.75rem; border-radius:10px; text-decoration:none;">Manage Subscriptions →</a>
      </div>
    </div>
  </div>
</body>
</html>
